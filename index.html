<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Исследование: Критическое мышление и копинг-стратегии</title>

<script src="https://unpkg.com/jspsych@7.3.4"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.3"></script>
<script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
<link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    background: #f0ebf8;
    margin: 0;
    padding: 20px 10px;
  }

  h3 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    color: #3c3c3c;
  }

  .jspsych-content {
    max-width: 700px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 24px 20px;
    box-shadow: 0 1px 3px rgba(60,64,67,0.15), 0 1px 2px rgba(60,64,67,0.1);
    border-top: 6px solid #5746e3;
  }

  .jspsych-survey-multi-choice-question,
  .jspsych-survey-likert-question,
  .jspsych-survey-multi-select-question {
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid #eee;
  }

  .block-label {
    color: #5746e3;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .jspsych-btn {
    font-family: 'Roboto', sans-serif;
    font-size: 16px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    background: #ffffff;
    color: #3c3c3c;
    margin: 4px 4px 4px 0;
    transition: all 0.15s ease;
  }
  .jspsych-btn:hover {
    background: #eeedfc;
    border-color: #5746e3;
  }

  #jspsych-instructions-next,
  #jspsych-survey-multi-choice-next,
  #jspsych-survey-text-next,
  #jspsych-survey-multi-select-next,
  #jspsych-survey-likert-next {
    font-family: 'Roboto', sans-serif;
    background: #5746e3 !important;
    color: #ffffff !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 10px 22px !important;
    font-size: 15px !important;
  }
  #jspsych-instructions-next:hover,
  #jspsych-survey-multi-choice-next:hover,
  #jspsych-survey-text-next:hover,
  #jspsych-survey-multi-select-next:hover,
  #jspsych-survey-likert-next:hover {
    background: #4636c9 !important;
  }

  input[type="radio"], input[type="checkbox"] {
    accent-color: #5746e3;
    width: 18px;
    height: 18px;
  }

  /* адаптив под телефон */
  @media (max-width: 480px) {
    body { font-size: 15px; padding: 10px 4px; }
    .jspsych-content { padding: 16px 14px; border-radius: 10px; }
    .block-label { font-size: 12px; }
    .jspsych-btn { font-size: 14px; padding: 9px 12px; display: block; width: 100%; box-sizing: border-box; margin: 4px 0; }
    /* таблица Лайкерта на телефоне тесная — уменьшаем шрифт вариантов */
    .jspsych-survey-likert-opts { font-size: 12px; }
  }
</style>
</head>
<body></body>
<script>

const jsPsych = initJsPsych();

const timeline = [];
const participantID = jsPsych.randomization.randomID(15);
jsPsych.data.addProperties({ participant_id: participantID });

// ==========================================
// 1. ИНФОРМИРОВАННОЕ СОГЛАСИЕ
// ==========================================
timeline.push({
  type: jsPsychInstructions,
  pages: [
    "<h3>Уважаемый участник!</h3>" +
    "<p>Перед Вами представлена форма анкеты и диагностический опросник для участия в научном исследовании: <i>«Роль критического мышления как предиктора выраженности проективной идентификации и снижения копинг-стратегий у пациентов с адаптационными расстройствами и у студентов-медиков»</i>.</p>" +
    "<p>Все Ваши ответы анонимны и будут использоваться только для анализа. Продолжая далее, вы соглашаетесь со всеми условиями.</p>" +
    "<p>Ознакомьтесь с текстом информированного согласия по ссылке: <a href='https://docs.google.com/document/d/1yMzP9ZnNErrOwJAGQdB__TWI0Hm5SAV_TiB3-T99A3s/edit?usp=sharing' target='_blank'>Форма согласия</a></p>"
  ],
  show_clickable_nav: true,
  button_label_next: "Я согласен(на) и хочу продолжить"
});

// ==========================================
// 1b. ВУЗ / БАЗА
// ==========================================
let selectedUniversity = "";

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [{
    prompt: "Укажите вуз / базу, где вы проходите тест:",
    name: "university",
    options: ["КГМА", "КРСУ", "КГТУ", "РЦПН", "Другое"],
    required: true,
  }],
  on_finish: function (data) {
    selectedUniversity = data.response.university;
  },
});

timeline.push({
  timeline: [{
    type: jsPsychSurveyText,
    questions: [{ prompt: "Укажите вуз/базу вручную:", name: "university_other", required: true }],
  }],
  conditional_function: function () {
    return selectedUniversity === "Другое";
  },
});

// ==========================================
// 2. ДЕМОГРАФИЧЕСКИЕ ДАННЫЕ
// ==========================================
let isStudent = "";

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [
    { prompt: "Ваш пол:", name: "gender", options: ["Мужской", "Женский"], required: true },
    { prompt: "Являетесь ли вы студентом?", name: "is_student", options: ["Да", "Нет"], required: true }
  ],
  on_finish: function (data) {
    isStudent = data.response.is_student;
  },
});

timeline.push({
  type: jsPsychSurveyText,
  questions: [
    { prompt: "Ваш возраст:", name: "age", required: true, type: "number" }
  ]
});

timeline.push({
  timeline: [{
    type: jsPsychSurveyText,
    questions: [{ prompt: "Если вы студент, то какого курса?", name: "course", required: true }],
  }],
  conditional_function: function() {
    return isStudent === "Да";
  }
});

// ==========================================
// 3. ИСПОЛЬЗОВАНИЕ ИИ
// ==========================================
let usesAI = "";

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [
    { prompt: "Используете ли вы ИИ?", name: "uses_ai", options: ["Да", "Нет"], required: true },
    { prompt: "Доверяете ли вы полученной от ИИ информации?", name: "trust_ai", options: ["Да определенно", "Скорее да, чем нет", "Нет", "Другое"], required: true },
    { prompt: "Насколько часто вы проверяете информацию, полученную от ИИ?", name: "check_ai", options: ["Всегда", "Иногда", "Я доверяю полученной информации", "Другое"], required: true },
    { prompt: "Считаете ли вы, что ИИ влияет на вашу успеваемость, ежедневную деятельность и уровень критического мышления?", name: "ai_influence_perf", options: ["Да", "Скорее да, чем нет", "Нет", "Другое"], required: true },
    { prompt: "Чувствуете ли вы, что использование ИИ повлияло на ваше поведение и память?", name: "ai_influence_behav", options: ["Да", "Нет", "Другое"], required: true }
  ],
  on_finish: function (data) {
    usesAI = data.response.uses_ai;
  },
});

timeline.push({
  timeline: [{
    type: jsPsychSurveyMultiSelect,
    questions: [{ 
      prompt: "Какой языковой моделью (ИИ) вы пользуетесь? (можете выбрать как один, так и несколько)", 
      name: "ai_models", 
      options: ["Chat GPT", "Yandex GPT", "Deep Seek", "Copilot", "Gemini", "Qwen", "Другое"], 
      required: false, 
      horizontal: false 
    }],
  }],
  conditional_function: function() {
    return usesAI === "Да";
  }
});

// ==========================================
// ==========================================
// 4. КОПИНГ-СТРАТЕГИИ (25 пунктов, по одному на экран)
// ==========================================
const copingItems = [
  "Когда я сталкиваюсь с трудностями, я стараюсь понять, что именно произошло и почему.",
  "Я активно ищу решения проблемы.",
  "Я стараюсь изменить что-то в себе, чтобы лучше справиться с ситуацией.",
  "Я ищу поддержки у друзей, семьи или других людей.",
  "Я пытаюсь посмотреть на ситуацию с другой стороны, чтобы найти в ней что-то позитивное.",
  "Я отстраняюсь от ситуации и стараюсь не думать о ней.",
  "Я стараюсь принять реальность ситуации, даже если она мне не нравится.",
  "Я планирую свои действия, чтобы справиться с проблемой.",
  "Я выражаю свои эмоции (гнев, разочарование и т.д.).",
  "Я стараюсь сохранять чувство юмора, даже когда мне тяжело.",
  "Я обращаюсь к духовным или религиозным практикам, если это применимо.",
  "Я избегаю людей или ситуаций, которые напоминают мне о проблеме.",
  "Я занимаюсь чем-то приятным или отвлекающим, чтобы не думать о стрессе.",
  "Я стараюсь контролировать свои чувства и не давать им волю.",
  "Я ищу профессиональной помощи, если чувствую, что не справляюсь сам.",
  "Я размышляю о том, что я мог бы сделать по-другому в будущем.",
  "Я возлагаю вину на себя за произошедшее.",
  "Я стараюсь просто пережить ситуацию, не предпринимая активных действий.",
  "Я пытаюсь узнать больше информации о проблеме, чтобы лучше ее понять.",
  "Я стараюсь не показывать, что мне плохо.",
  "Я иногда позволяю себе плакать или кричать, чтобы снять напряжение.",
  "Я представляю себе наихудшие сценарии развития событий.",
  "Я убеждаю себя, что все будет хорошо, даже если это не так очевидно.",
  "Я стараюсь сохранять оптимизм, несмотря ни на что.",
  "Я занимаюсь физической активностью или спортом, чтобы снять стресс."
];

const likertLabels = ["Совсем не так", "Немного так", "В некоторой степени так", "Довольно часто так", "Почти всегда так"];

timeline.push({
  type: jsPsychInstructions,
  pages: ["<p><b>Инструкция:</b> Этот опрос поможет понять, каким образом вы обычно справляетесь со стрессовыми ситуациями. Мы не оцениваем правильность или ошибочность ваших ответов — каждый человек уникален. Пожалуйста, прочтите каждое утверждение и отметьте, насколько часто или характерно для вас такое поведение в стрессовой ситуации. Отвечайте честно — так, как вы поступаете на самом деле.</p>"],
  show_clickable_nav: true,
  button_label_next: "Начать"
});

copingItems.forEach((item, index) => {
  timeline.push({
    type: jsPsychSurveyLikert,
    questions: [{ prompt: item, name: `coping_${index + 1}`, labels: likertLabels }],
    data: { block: "coping", item_id: index + 1 },
  });
});

// ==========================================
// 5. КРИТИЧЕСКОЕ МЫШЛЕНИЕ (5 блоков)
// ==========================================
function makeCTItem(blockName, itemId, text, options, correctIndex = null) {
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="block-label">${blockName} · Задание ${itemId}</div><div style="text-align: left; margin-bottom: 20px;">${text}</div>`,
    choices: options,
    data: { block: blockName, item_id: itemId, correct_index: correctIndex },
    on_finish: function(data) {
      if (correctIndex !== null) {
        data.correct = (data.response === correctIndex);
      }
    }
  };
}

const block1Options = ["Несомненно истинно", "Вероятно истинно", "Недостаточно данных", "Вероятно ложно", "Несомненно ложно"];
timeline.push({ type: jsPsychInstructions, pages: ["<h3>Блок 1: Умение делать выводы (Inference)</h3><p>Прочитайте текст и оцените утверждение, основываясь на приведённой информации.</p>"], show_clickable_nav: true, button_label_next: "Начать блок" });
timeline.push(makeCTItem("Умение делать выводы", "1.1", "<b>Текст:</b> На групповом занятии один из участников сказал: «Я доверяю своим чувствам больше, чем фактам. Иногда просто 'чувствую', что решение правильное».<br><br><b>Утверждение:</b> Этот участник всегда делает верные выводы.", block1Options));
timeline.push(makeCTItem("Умение делать выводы", "1.2", "<b>Текст:</b> Из 30 опрошенных человек, 25 сообщили, что испытывают усталость после общения в соцсетях.<br><br><b>Утверждение:</b> Использование соцсетей вызывает усталость у большинства людей.", block1Options));
timeline.push(makeCTItem("Умение делать выводы", "1.3", "<b>Текст:</b> На собрании врач сказал: «Пациенты часто не выполняют рекомендации, если не понимают их».<br><br><b>Утверждение:</b> Информирование пациента повышает степень понимания и взаимодействия между пациентом и врачом.", block1Options));
timeline.push(makeCTItem("Умение делать выводы", "1.4", "<b>Текст:</b> Человек ежедневно пользуется навигатором и утверждает, что у него хорошая пространственная ориентация.<br><br><b>Утверждение:</b> Пользование навигатором развивает пространственное мышление.", block1Options));
timeline.push(makeCTItem("Умение делать выводы", "1.5", "<b>Текст:</b> Из 100 человек 97 сообщили, что чувствовали тревогу при выступлении на публике.<br><br><b>Утверждение:</b> Большинство людей испытывают тревогу при публичных выступлениях.", block1Options));

timeline.push({ type: jsPsychInstructions, pages: ["<h3>Блок 2: Выявление предпосылок (Recognition of Assumptions)</h3><p>Определите скрытую предпосылку (неявное предположение) в приведённом утверждении.</p>"], show_clickable_nav: true, button_label_next: "Начать блок" });
timeline.push(makeCTItem("Выявление предпосылок", "2.1", "<b>Утверждение:</b> «Если человек не умеет фильтровать информацию, он не способен мыслить критически».", ["Человеку обязательно нужен фильтр", "Критическое мышление связано с вниманием", "Умение фильтровать — основа КМ", "Вся информация вредна", "Фильтрация информации и КМ — синонимы"]));
timeline.push(makeCTItem("Выявление предпосылок", "2.2", "<b>Утверждение:</b> «Использование языковых моделей снижает когнитивную нагрузку, а значит — и нагрузку на личную ответственность».", ["Когнитивная нагрузка всегда связана с ответственностью", "ИИ делает людей безответственными", "Ответственность и мышление — одно и то же", "Использование ИИ влияет на поведение", "Люди не умеют использовать ИИ правильно"]));
timeline.push(makeCTItem("Выявление предпосылок", "2.3", "<b>Утверждение:</b> «Человек, не способный видеть различия между своими чувствами и фактами, не может быть объективным».", ["Эмоции всегда мешают", "Объективность требует отделения чувств от фактов", "Никто не может быть полностью объективным", "Факты зависят от восприятия", "Только логика важна"]));
timeline.push(makeCTItem("Выявление предпосылок", "2.4", "<b>Утверждение:</b> «Если студент не пользуется ИИ, он учится лучше».", ["Все студенты используют ИИ одинаково", "ИИ снижает качество обучения", "Качество обучения зависит от инструментов", "Учёба без ИИ — более осознанна", "Все студенты учатся одинаково"]));
timeline.push(makeCTItem("Выявление предпосылок", "2.5", "<b>Утверждение:</b> «Человек не может быть рациональным, если он эмоционально нестабилен».", ["Эмоции мешают рациональности", "Рациональность и эмоциональность несовместимы", "Эмоциональная нестабильность исключает разум", "Только логика даёт рациональность", "Умные люди контролируют эмоции"]));

const block3Options = ["Следует логически", "Не следует логически"];
timeline.push({ type: jsPsychInstructions, pages: ["<h3>Блок 3: Дедукция (Deduction)</h3><p>Определите, следует ли логически вывод из данных утверждений.</p>"], show_clickable_nav: true, button_label_next: "Начать блок" });
timeline.push(makeCTItem("Дедукция", "3.1", "<b>Утверждения:</b><br>1) Все адаптивные копинг-стратегии включают осознанную переработку информации.<br>2) Некоторые пациенты не перерабатывают информацию осознанно.<br><br><b>Вывод:</b> Некоторые пациенты не используют адаптивные копинг-стратегии.", block3Options));
timeline.push(makeCTItem("Дедукция", "3.2", "<b>Утверждения:</b><br>1) Некоторые люди, испытывающие стресс, склонны к проекции.<br>2) Все проективные механизмы снижают психическое напряжение.<br><br><b>Вывод:</b> Некоторые люди снижают напряжение с помощью проекции.", block3Options));
timeline.push(makeCTItem("Дедукция", "3.3", "<b>Утверждения:</b><br>1) Все студенты изучают медицину.<br>2) Некоторые студенты не используют ИИ.<br><br><b>Вывод:</b> Некоторые студенты, не использующие ИИ, изучают медицину.", block3Options));
timeline.push(makeCTItem("Дедукция", "3.4", "<b>Постулаты:</b><br>1) Все формы магического мышления основаны на искажённой причинности.<br>2) Некоторые пациенты демонстрируют магическое мышление.<br><br><b>Вывод:</b> Некоторые пациенты используют искажённую причинность.", block3Options));
timeline.push(makeCTItem("Дедукция", "3.5", "<b>Постулаты:</b><br>1) Никто из студентов 5 курса не проходил психиатрию.<br>2) Все студенты 5 курса — клиницисты.<br><br><b>Вывод:</b> Некоторые клиницисты не проходили психиатрию.", block3Options));

const block4Options = ["Несомненно истинно", "Вероятно истинно", "Недостаточно данных", "Вероятно ложно", "Несомненно ложно"];
timeline.push({ type: jsPsychInstructions, pages: ["<h3>Блок 4: Интерпретация информации (Interpretation)</h3><p>Прочитайте текст и оцените предложенное утверждение.</p>"], show_clickable_nav: true, button_label_next: "Начать блок" });
timeline.push(makeCTItem("Интерпретация", "4.1", "<b>Текст:</b> Пациент говорит: «Мне кажется, что все сотрудники относятся ко мне холодно. Они не улыбаются и стараются быстро закончить разговор».<br><br><b>Утверждение:</b> Сотрудники проявляют к пациенту враждебность.", block4Options));
timeline.push(makeCTItem("Интерпретация", "4.2", "<b>Текст:</b> Из 40 студентов 22 заявили, что ИИ делает их учебу эффективнее, 18 — что не замечают изменений.<br><br><b>Утверждение:</b> Более половины студентов замечают улучшение от ИИ.", block4Options));
timeline.push(makeCTItem("Интерпретация", "4.3", "<b>Текст:</b> Пациент с расстройством адаптации избегает разговора о работе и говорит, что «не видит смысла».<br><br><b>Утверждение:</b> Избегание работы — один из симптомов расстройства адаптации.", block4Options));
