    <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест критического мышления</title>

<script src="https://unpkg.com/jspsych@7.3.4"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.3"></script>
<script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
<link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    background: #f0ebf8;
    margin: 0;
    padding: 24px 12px;
  }

  h3 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    color: #3c3c3c;
  }

  /* "карточка" вопроса — как в Google Forms */
  .jspsych-content {
    max-width: 700px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: 0 1px 3px rgba(60,64,67,0.15), 0 1px 2px rgba(60,64,67,0.1);
    border-top: 6px solid #5746e3;
  }

  .block-label {
    color: #5746e3;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* кнопки ответов (html-button-response) */
  .jspsych-btn {
    font-family: 'Roboto', sans-serif;
    font-size: 16px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #d0d0d0;
    background: #ffffff;
    color: #3c3c3c;
    margin: 4px;
    transition: all 0.15s ease;
  }
  .jspsych-btn:hover {
    background: #eeedfc;
    border-color: #5746e3;
  }

  /* кнопка "Далее" в instructions/survey */
  #jspsych-instructions-next,
  #jspsych-survey-multi-choice-next,
  #jspsych-survey-text-next {
    font-family: 'Roboto', sans-serif;
    background: #5746e3 !important;
    color: #ffffff !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 10px 22px !important;
    font-size: 15px !important;
  }
  #jspsych-instructions-next:hover,
  #jspsych-survey-multi-choice-next:hover,
  #jspsych-survey-text-next:hover {
    background: #4636c9 !important;
  }

  /* радио-кнопки опросников */
  input[type="radio"] {
    accent-color: #5746e3;
    width: 18px;
    height: 18px;
  }

  .jspsych-survey-multi-choice-question,
  .jspsych-survey-text-question {
    font-size: 17px;
    margin-bottom: 14px;
    color: #3c3c3c;
  }

  /* адаптив под телефон */
  @media (min-width: 768px) {
    body { font-size: 18px; }
  }
  @media (max-width: 400px) {
    body { font-size: 16px; padding: 12px 6px; }
    .jspsych-content { padding: 20px 16px; }
    .block-label { font-size: 13px; }
  }
</style>
</head>
<body></body>
<script>

const jsPsych = initJsPsych();

const timeline = [];

timeline.push({
  type: jsPsychInstructions,
  pages: [
    "<h3>Тест критического мышления</h3>" +
    "<p>Вам будет предложено несколько блоков заданий разного типа. " +
    "Отвечайте как можно точнее — время вашего ответа тоже фиксируется, " +
    "но не старайтесь специально спешить или медлить, отвечайте в своём обычном темпе.</p>",
  ],
  show_clickable_nav: true,
  button_label_next: "Далее",
});

const participantID = jsPsych.randomization.randomID(15);
jsPsych.data.addProperties({ participant_id: participantID });

let selectedUniversity = "";

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [{
    prompt: "Укажите вуз / базу, где вы проходите тест:",
    name: "university",
    options: ["КГМА", "КРСУ", "КГТУ", "РЦПН", "Другое"],
    required: true,
  }],
  on_finish: function (data) {
    selectedUniversity = data.response.university;
  },
});

timeline.push({
  type: jsPsychSurveyText,
  questions: [{
    prompt: "Укажите вуз/базу вручную:",
    name: "university_other",
    required: true
  }],
  conditional_function: function () {
    return selectedUniversity === "Другое";
  },
});

function makeItem(block, item_id, stimulus, choices, correct_index) {
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<div class="block-label">' + blockLabel(block) + ' · ' + item_id + '</div>' + stimulus,
    choices: choices,
    data: { block: block, item_id: item_id, correct_index: correct_index },
    on_finish: function (data) {
      data.correct = (data.response === correct_index);
    },
  };
}

function blockLabel(block) {
  const labels = {
    deduction: 'Дедукция',
    induction: 'Индукция',
    interpretation: 'Интерпретация',
    argumentation: 'Аргументация',
  };
  return labels[block] || block;
}

function blockIntro(title, text) {
  return {
    type: jsPsychInstructions,
    pages: ['<h3>' + title + '</h3><p>' + text + '</p>'],
    show_clickable_nav: true,
    button_label_next: "Начать блок",
  };
}

timeline.push(blockIntro("Блок 1. Дедукция", "В этом блоке нужно оценить, следует ли вывод логически из посылок."));

timeline.push(makeItem(
  "deduction", "D1",
  "<p><b>Посылки:</b> Все врачи изучают анатомию. Иван — врач.<br>" +
  "<b>Вывод:</b> Иван изучал анатомию.</p><p>Следует ли вывод логически из посылок?</p>",
  ["Да, следует", "Нет, не следует", "Недостаточно данных"],
  0
));

timeline.push(makeItem(
  "deduction", "D2",
  "<p><i>[ЗАГЛУШКА — замените на реальный пункт вашего банка заданий]</i></p>",
  ["Вариант 1", "Вариант 2", "Вариант 3"],
  0
));

timeline.push(blockIntro("Блок 2. Индукция", "Оцените, насколько обоснованно обобщение на основе приведённых наблюдений."));

timeline.push(makeItem(
  "induction", "I1",
  "<p><i>[ЗАГЛУШКА — пример: серия наблюдений + предлагаемое обобщение]</i></p>",
  ["Обобщение обосновано", "Обобщение не обосновано", "Данных недостаточно"],
  1
));

timeline.push(blockIntro("Блок 3. Интерпретация", "Определите, подтверждается ли предложенная интерпретация приведённым текстом или данными."));

timeline.push(makeItem(
  "interpretation", "N1",
  "<p><i>[ЗАГЛУШКА — короткий текст/график + предлагаемая интерпретация]</i></p>",
  ["Подтверждается", "Не подтверждается", "Частично подтверждается"],
  0
));

timeline.push(blockIntro("Блок 4. Аргументация", "Оцените, насколько приведённый аргумент силён по отношению к обсуждаемому вопросу."));

timeline.push(makeItem(
  "argumentation", "A1",
  "<p><i>[ЗАГЛУШКА — вопрос + аргумент за/против]</i></p>",
  ["Сильный аргумент", "Слабый аргумент"],
  0
));

timeline.push({
  type: jsPsychPipe,
  action: "save",
  experiment_id: "NUuDiPtIw9j6",
  filename: `${participantID}.csv`,
  data_string: () => jsPsych.data.get().csv(),
});

timeline.push({
  type: jsPsychInstructions,
  pages: [
    function () {
      return "<h3>Тест завершён</h3>" +
        "<p>Спасибо за участие. Результаты сохранены автоматически.</p>" +
        "<p>Ваш идентификатор участника (сохраните его, если захотите " +
        "отозвать согласие на использование данных):</p>" +
        "<p style='font-size:22px; font-weight:bold; letter-spacing:1px; color:#5746e3;'>" +
        participantID + "</p>";
    },
  ],
  show_clickable_nav: true,
  button_label_next: "Завершить",
});

jsPsych.run(timeline);

</script>
</html>
