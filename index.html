<body>

<script>

window.addEventListener("beforeunload", function (e) {
  e.preventDefault();
  e.returnValue = "";
});

const studyProgress = {
  currentPart: 0,
  percent: 0,
  completed: false
};

function updateStudyProgress(part, percentWithinPart = 0) {
  if (studyProgress.completed) return;
  const safePart = Math.max(1, Math.min(4, part || 1));
  const within = Math.max(0, Math.min(100, percentWithinPart || 0));
  const overall = Math.min(100, ((safePart - 1) * 25) + (within * 0.25));
  studyProgress.currentPart = safePart;
  studyProgress.percent = overall;

  const fill = document.getElementById("study-progress-fill");
  const pct = document.getElementById("study-progress-percent");
  const partLabel = document.getElementById("study-progress-part");
  const track = document.getElementById("study-progress-track");
  if (fill) fill.style.width = overall.toFixed(1) + "%";
  if (pct) pct.textContent = Math.round(overall) + "%";
  if (partLabel) partLabel.textContent = "Часть " + safePart + " из 4";
  if (track) {
    track.setAttribute("role", "progressbar");
    track.setAttribute("aria-valuemin", "0");
    track.setAttribute("aria-valuemax", "100");
    track.setAttribute("aria-valuenow", Math.round(overall));
  }
  document.querySelectorAll(".study-progress-marker").forEach((marker, i) => {
    marker.style.opacity = "1";
    const markerThreshold = (i + 1) * 25;
    marker.style.transform = overall >= markerThreshold ? "scale(1.3)" : "scale(1)";
  });
}

const progressHTML = `
  <div id="study-progress" aria-label="Прогресс исследования">
    <div id="study-progress-inner">
      <div id="study-progress-top">
        <span id="study-progress-part">Часть 1 из 4</span>
        <span id="study-progress-percent">0%</span>
      </div>
      <div id="study-progress-track">
        <div id="study-progress-fill"></div>
        <span class="study-progress-marker"></span>
        <span class="study-progress-marker"></span>
        <span class="study-progress-marker"></span>
      </div>
      <div class="study-progress-labels">
        <span>Общие вопросы</span>
        <span>Тревога + депрессия</span>
        <span>Копинг</span>
        <span>КМ</span>
      </div>
    </div>
  </div>`;
const progressNode = document.createElement("div");
progressNode.innerHTML = progressHTML;
document.body.appendChild(progressNode.firstElementChild);

const blockTiming = {};
const partTiming = {};
const partQuestionCounts = {1: 0, 2: 0, 3: 0, 4: 0};
const partExpectedQuestions = {1: 14, 2: 16, 3: 26, 4: 26};
let lastTrialStart = null;
let excludedTimingMs = 0; // примеры/обучающие экраны, которые не входят в аналитическое время
const partExcludedMs = { 1: 0, 2: 0, 3: 0, 4: 0 }; // то же самое, но по каждой части отдельно

function timingBlockFor(data) {
  if (!data) return null;
  if (data.block === "phq9") return "PHQ-9";
  if (data.block === "gad7") return "GAD-7";
  if (data.block === "coping") return "Копинг";
  if (data.block === "attention_check") return "Копинг";
  if (data.block === "training") return "КМ · пример";
  if (data.block === "Умение делать выводы") return "КМ · Выводы";
  if (data.block === "Выявление предпосылок") return "КМ · Предпосылки";
  if (data.block === "Дедукция") return "КМ · Дедукция";
  if (data.block === "Интерпретация") return "КМ · Интерпретация";
  if (data.block === "Оценка аргументов") return "КМ · Аргументы";
  if (data.block === "university" || data.block === "demographics" ||
      data.block === "student_course" || data.block === "student_gpa" ||
      data.block === "ai") return "Общие вопросы";
  return null;
}

function partForBlock(block) {
  if (!block) return null;
  if (block === "PHQ-9" || block === "GAD-7") return 2;
  if (block === "Копинг") return 3;
  if (block.indexOf("КМ") === 0) return 4;
  if (block === "Общие вопросы") return 1;
  return null;
}

function beginTiming(data) {
  lastTrialStart = performance.now();
  const block = timingBlockFor(data);
  const part = partForBlock(block);
  if (block && !blockTiming[block]) blockTiming[block] = { start: lastTrialStart, end: null, duration: 0 };
  if (part && !partTiming[part]) partTiming[part] = { start: lastTrialStart, end: null, duration: 0 };
}

function finishTiming(data) {
  const now = performance.now();
  const duration = lastTrialStart == null ? null : Math.max(0, now - lastTrialStart);
  if (duration != null) data.trial_duration_ms = Math.round(duration);

  const block = timingBlockFor(data);
  const part = partForBlock(block);

  if (duration != null && (data.block === "training" || data.timing_exclude === true)) {
    excludedTimingMs += duration;
    data.timing_excluded = true;
    if (part) partExcludedMs[part] += duration;
  }

  if (block) {
    if (!blockTiming[block]) blockTiming[block] = { start: now - (duration || 0), end: now, duration: 0 };
    blockTiming[block].end = now;
    blockTiming[block].duration = blockTiming[block].end - blockTiming[block].start;
  }
  if (part) {
    if (!partTiming[part]) partTiming[part] = { start: now - (duration || 0), end: now, duration: 0 };
    partTiming[part].end = now;
    partTiming[part].duration = partTiming[part].end - partTiming[part].start;

    if (block) {
      partQuestionCounts[part] += 1;
      const within = Math.min(100, (partQuestionCounts[part] / partExpectedQuestions[part]) * 100);
      updateStudyProgress(part, within);
    }
  }
}

function startPartTiming(part) {
  const now = performance.now();
  if (part > 1 && partTiming[part - 1] && !partTiming[part - 1].end) {
    partTiming[part - 1].end = now;
    partTiming[part - 1].duration = now - partTiming[part - 1].start;
  }
  if (!partTiming[part]) partTiming[part] = { start: now, end: null, duration: 0 };
}

function closePartTiming(part) {
  const now = performance.now();
  if (partTiming[part]) {
    partTiming[part].end = now;
    partTiming[part].duration = now - partTiming[part].start;
  }
}

function minutes2(ms) {
  return ms == null ? "" : Math.round(ms / 60000 * 100) / 100;
}

function calculatePsychometricScores() {
  const phqRows = jsPsych.data.get().filter({block: "phq9"}).values();
  const gadRows = jsPsych.data.get().filter({block: "gad7"}).values();

  // jsPsych SurveyLikert stores response as an object, e.g.
  // { phq9_1: 2 }, not as a bare number.
  const rowValue = (row, prefix) => {
    if (!row || row.response == null) return 0;
    if (typeof row.response === "object") {
      const key = prefix + "_" + row.item_id;
      const v = Number(row.response[key]);
      return Number.isFinite(v) ? v : 0;
    }
    const v = Number(row.response);
    return Number.isFinite(v) ? v : 0;
  };

  const sumResponses = (rows, prefix) => rows.reduce((sum, row) => sum + rowValue(row, prefix), 0);

  const phq9Score = sumResponses(phqRows, "phq9");
  const gad7Score = sumResponses(gadRows, "gad7");
  const suicidalRow = phqRows.find(row => Number(row.item_id) === 9);
  const suicidalThoughts = suicidalRow ? rowValue(suicidalRow, "phq9") > 0 : false;

  const phqSeverity =
    phq9Score <= 4 ? "минимальные" :
    phq9Score <= 9 ? "лёгкие" :
    phq9Score <= 14 ? "умеренные" :
    phq9Score <= 19 ? "умеренно тяжёлые" : "тяжёлые";

  const gadSeverity =
    gad7Score <= 4 ? "минимальная" :
    gad7Score <= 9 ? "лёгкая" :
    gad7Score <= 14 ? "умеренная" : "тяжёлая";

  return {
    phq9_score: phq9Score,
    phq9_severity: phqSeverity,
    gad7_score: gad7Score,
    gad7_severity: gadSeverity,
    suicidal_thoughts_flag: suicidalThoughts,
    high_depression_flag: phq9Score >= 10,
    high_anxiety_flag: gad7Score >= 10,
    safety_screen_triggered: suicidalThoughts || phq9Score >= 10
  };
}

function timingSummaryProperties() {
  const totalMs = performance.now() - startTime;
  const measuredMs = Math.max(0, totalMs - excludedTimingMs);
  return {
    total_elapsed_ms: Math.round(totalMs),
    total_elapsed_min: minutes2(totalMs),
    total_duration_ms: Math.round(measuredMs),
    total_duration_min: minutes2(measuredMs),
    part1_duration_min: minutes2(Math.max(0, (partTiming[1]?.duration || 0) - partExcludedMs[1])),
    part2_duration_min: minutes2(Math.max(0, (partTiming[2]?.duration || 0) - partExcludedMs[2])),
    part3_duration_min: minutes2(Math.max(0, (partTiming[3]?.duration || 0) - partExcludedMs[3])),
    part4_duration_min: minutes2(Math.max(0, (partTiming[4]?.duration || 0) - partExcludedMs[4])),
    phq9_duration_min: minutes2(blockTiming["PHQ-9"]?.duration),
    gad7_duration_min: minutes2(blockTiming["GAD-7"]?.duration),
    coping_duration_min: minutes2(blockTiming["Копинг"]?.duration),
    ct_inference_duration_min: minutes2(blockTiming["КМ · Выводы"]?.duration),
    ct_assumptions_duration_min: minutes2(blockTiming["КМ · Предпосылки"]?.duration),
    ct_deduction_duration_min: minutes2(blockTiming["КМ · Дедукция"]?.duration),
    ct_interpretation_duration_min: minutes2(blockTiming["КМ · Интерпретация"]?.duration),
    ct_arguments_duration_min: minutes2(blockTiming["КМ · Аргументы"]?.duration)
  };
}

const jsPsych = initJsPsych({
  display_element: 'jspsych-target',
  show_progress_bar: false,
  on_trial_start: function(data) { beginTiming(data); },
  on_trial_finish: function(data) { finishTiming(data); }
});

const timeline = [];
const participantID = jsPsych.randomization.randomID(15);
const startTime = performance.now();
jsPsych.data.addProperties({ participant_id: participantID });

// ==========================================
// СОГЛАСИЕ
// ==========================================
timeline.push({
  type: jsPsychInstructions,
  pages: [
    "<h3>Уважаемый участник!</h3>" +
    "<p>Перед Вами представлена форма анкеты и диагностический опросник для участия в научном исследовании: <i>«Роль критического мышления как предиктора выраженности проективной идентификации и снижения копинг-стратегий у пациентов с адаптационными расстройствами и у студентов-медиков»</i>.</p>" +
    "<p>Все Ваши ответы анонимны и будут использоваться только для анализа.</p>" +
    "<p>Ознакомьтесь с текстом информированного согласия по ссылке: <a href='https://docs.google.com/document/d/1yMzP9ZnNErrOwJAGQdB__TWI0Hm5SAV_TiB3-T99A3s/edit?usp=sharing' target='_blank'>Форма согласия</a></p>"
  ],
  show_clickable_nav: true,
  button_label_next: "Далее"
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: "<h3>Согласие на участие</h3>" +
            "<p>Подтверждаете ли вы своё добровольное согласие на участие в исследовании и обработку анонимных данных?</p>",
  choices: ["Да, я согласен(на)", "Нет, я не согласен(на)"],
  on_finish: function(data) {
    if (data.response === 1) {
      jsPsych.endExperiment(
        "<div class='jspsych-content'><h3>Участие прекращено</h3>" +
        "<p>Спасибо за уделённое время. Ваши данные не были сохранены.</p>" +
        "<p>Вы можете закрыть вкладку браузера.</p></div>"
      );
    }
  }
});

// ==========================================
// ЧАСТЬ 1. АНКЕТИРОВАНИЕ
// ==========================================
timeline.push({
  type: jsPsychInstructions,
  pages: ["<div class='part-label'>Часть 1 из 4</div><h3>Общие вопросы</h3><p>Несколько общих вопросов о вас. Это займёт около минуты.</p>"],
  show_clickable_nav: true,
  button_label_next: "Начать",
  on_load: function() { startPartTiming(1); updateStudyProgress(1, 0); }
});

let selectedUniversity = "";

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [{
    prompt: "Укажите вуз / базу, где вы проходите тест:",
    name: "university",
    options: ["КГМА", "КРСУ", "КГТУ", "РЦПН", "Другое"],
    required: true,
  }],
  data: { block: "university" },
  on_finish: function (data) {
    selectedUniversity = data.response.university;
  },
});

timeline.push({
  timeline: [{
    type: jsPsychSurveyText,
    questions: [{ prompt: "Укажите вуз/базу вручную:", name: "university_other", required: true }],
    data: { block: "university" }
  }],
  conditional_function: function () {
    return selectedUniversity === "Другое";
  },
});

timeline.push({
  type: jsPsychSurveyMultiChoice,
  questions: [{
    prompt: "Находитесь ли вы на лечении в РЦПН в связи с диагнозом?",
    name: "patient_status",
    options: ["Да, у меня установлен диагноз F43.2 (расстройство адаптации)",
              "Да, но по другому диагнозу",
              "Нет, я не пациент"],
    required: true,
  }],
  data: { block: "patient_screening" },
  conditional_function: function() { return selectedUniversity === "РЦПН"; }
});

let isStudent = "";
let enteredAge = null;

timeline.push({

// ------------------------------------------
// 3в. Критическое мышление (Приложение I, адаптированная WGCTA)
// ------------------------------------------
// Система баллов — по официальному ключу Приложения I:
// 5-вариантные задания (Inference, Assumptions, Interpretation): 3/2/1/0 баллов
//   в зависимости от "расстояния" выбранного ответа до правильного по шкале A-E.
// Бинарные задания (Deduction, Evaluation of Arguments): 3 балла за верный ответ, 0 за неверный.
// Максимум: 25 заданий × 3 балла = 75 баллов (совпадает с официальной интерпретационной таблицей).
function makeCTItem(blockName, itemId, text, options, correctIndex) {
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="block-label">${blockName} · Задание ${itemId}</div><div style="text-align: left; margin-bottom: 20px;">${text}</div>`,
    choices: options,
    data: { block: blockName, item_id: itemId, correct_index: correctIndex },
    on_finish: function(data) {
      data.correct = (data.response === correctIndex);
      if (options.length === 2) {
        data.score = (data.response === correctIndex) ? 3 : 0;
      } else {
        const distance = Math.abs(data.response - correctIndex);
        data.score = Math.max(0, 3 - distance);
      }
    }
  };
}

    const summary = timingSummaryProperties();
    jsPsych.data.addProperties({ ...scoreSummary, ...summary });

    const rows = jsPsych.data.get().values();

    fetch(SHEETS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // так короче путь без CORS preflight
      body: JSON.stringify({ rows: rows })
    })
      .then(() => done())
      .catch(() => done()); // не блокируем участника, даже если сеть подвела
  },
  on_start: function() {
    const overlay = document.createElement("div");
    overlay.id = "datapipe-loader-overlay";
    overlay.innerHTML = `
      <div id="datapipe-loader-ring">
        <span id="datapipe-loader-percent">0%</span>
      </div>
      <div id="datapipe-loader-text">Сохраняем ваши ответы…</div>`;
    document.body.appendChild(overlay);

    const ring = document.getElementById("datapipe-loader-ring");
    const pctLabel = document.getElementById("datapipe-loader-percent");
    let pct = 0;
    // Имитация прогресса: быстро набирает до ~90%, дальше почти останавливается —
    // реальный сетевой прогресс fetch() в браузере недоступен, поэтому это
    // визуальная имитация ожидания, а не точный процент переданных байт.
    window.__datapipeLoaderTimer = setInterval(() => {
      const step = pct < 60 ? 4 : pct < 85 ? 1.2 : 0.2;
      pct = Math.min(93, pct + step);
      ring.style.background = `conic-gradient(#5746e3 ${pct * 3.6}deg, #ececf3 0deg)`;
      pctLabel.textContent = Math.round(pct) + "%";
    }, 150);
  },
  on_finish: function() {
    clearInterval(window.__datapipeLoaderTimer);
    const ring = document.getElementById("datapipe-loader-ring");
    const pctLabel = document.getElementById("datapipe-loader-percent");
    if (ring) ring.style.background = "conic-gradient(#5746e3 360deg, #ececf3 0deg)";
    if (pctLabel) pctLabel.textContent = "100%";
    setTimeout(() => {
      const overlay = document.getElementById("datapipe-loader-overlay");
      if (overlay) overlay.remove();
    }, 300);
  },
});

// ==========================================
// ЗАВЕРШЕНИЕ (дебрифинг)
// ==========================================
timeline.push({
  type: jsPsychInstructions,
  pages: [
    function() {
      return "<h3>Исследование завершено 🎉</h3>" +
        "<p>Спасибо за участие! Ваши ответы успешно сохранены.</p>" +
        "<p>Ваш идентификатор участника (сохраните его, если захотите отозвать согласие на использование данных):</p>" +
        `<div style="display:flex; align-items:center; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0;">
          <span id="participant-id-span" style='font-size:22px; font-weight:bold; letter-spacing:1px; color:#5746e3;'>${participantID}</span>
          <button id="copy-id-btn" class="jspsych-btn" type="button">Скопировать</button>
        </div>` +
        "<p style='color:#777; font-size:14px;'>Нажмите «Далее», чтобы узнать больше об исследовании.</p>";
    },
    "<h3>О чём было это исследование?</h3>" +
    "<p>Вы прошли анкетирование, направленное на изучение связи между <b>критическим мышлением</b>, <b>стратегиями совладания со стрессом (копинг-стратегиями)</b> и <b>опытом использования искусственного интеллекта</b>, с учётом уровня настроения и тревожности.</p>" +
    "<p><i>Полные результаты исследования будут доступны после завершения набора данных. Обратите внимание: мы не сообщаем «правильные ответы» на задания сейчас, чтобы не повлиять на будущих участников.</i></p>",
    "<h3>Вопросы и контакты</h3>" +
    "<p>Если у вас возникли вопросы об исследовании или вы хотите отозвать свои данные, свяжитесь с нами:</p>" +
    "<p>📧 email@example.com<br>🔬 Руководитель исследования: [ФИО]</p>" +
    "<p>Ещё раз спасибо за ваш вклад в науку!</p>"
  ],
  show_clickable_nav: true,
  button_label_next: "Далее",
  button_label_previous: "Назад",
  on_load: function() {
    const btn = document.getElementById("copy-id-btn");
    if (!btn) return;
    btn.addEventListener("click", function() {
      const text = participantID;
      const showResult = (ok) => {
        btn.textContent = ok ? "Скопировано ✓" : "Не удалось скопировать";
        setTimeout(() => { btn.textContent = "Скопировать"; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showResult(true)).catch(() => legacyCopy());
      } else {
        legacyCopy();
      }
      function legacyCopy() {
        try {
          const tmp = document.createElement("textarea");
          tmp.value = text;
          tmp.style.position = "fixed";
          tmp.style.opacity = "0";
          document.body.appendChild(tmp);
          tmp.focus();
          tmp.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(tmp);
          showResult(ok);
        } catch (e) {
          showResult(false);
        }
      }
    });
  },
  on_load: function() {
    studyProgress.completed = true;
    const bar = document.getElementById("study-progress");
    if (bar) bar.style.display = "none";
  }
});

jsPsych.run(timeline);

</script>
</html>
